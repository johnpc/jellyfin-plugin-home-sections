name: Build and Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.x
    
    - name: Restore dependencies
      run: dotnet restore jellyfin-plugin-home-sections-demo.sln
    
    - name: Build
      run: dotnet build jellyfin-plugin-home-sections-demo.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=false
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Create release directory
      run: |
        mkdir -p release
        find . -path "*/bin/Release/net9.0/*.dll" -exec cp {} release/ \;
    
    - name: Create zip file
      run: |
        cd release
        zip -r ../jellyfin-plugin-home-sections-${{ steps.get_version.outputs.VERSION }}.zip .
        cd ..
    
    - name: Calculate checksum
      id: calculate_checksum
      run: |
        CHECKSUM=$(md5sum jellyfin-plugin-home-sections-${{ steps.get_version.outputs.VERSION }}.zip | awk '{ print $1 }')
        echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT
    
    - name: Create manifest.json
      run: |
        cat > manifest.json << MANIFEST_EOF
        [
          {
            "guid": "c0d60e8b-2g3g-6f3h-1d5g-0e7h9f8g6c5d",
            "name": "Home Sections",
            "overview": "Customize home screen sections",
            "description": "Customize home screen sections",
            "owner": "jellyfin-plugin-home-sections",
            "category": "General",
            "versions": [
              {
                "version": "${{ steps.get_version.outputs.VERSION }}",
                "changelog": "See the full changelog at [GitHub](https://github.com/johnpc/jellyfin-plugin-home-sections/releases/tag/${{ steps.get_version.outputs.VERSION }})",
                "targetAbi": "10.11.0.0",
                "sourceUrl": "https://github.com/johnpc/jellyfin-plugin-home-sections/releases/download/${{ steps.get_version.outputs.VERSION }}/jellyfin-plugin-home-sections-${{ steps.get_version.outputs.VERSION }}.zip",
                "checksum": "${{ steps.calculate_checksum.outputs.CHECKSUM }}",
                "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              }
            ]
          }
        ]
        MANIFEST_EOF
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          jellyfin-plugin-home-sections-${{ steps.get_version.outputs.VERSION }}.zip
          manifest.json
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
